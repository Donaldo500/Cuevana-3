<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/main.css">
    <script src="js/functions.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>Cuevana 3</title>
</head>

<body>
    <header>
        <div class="icons">
            <img src="img/logo-cuevana.PNG" alt="Cuevana_logo">
            <button>Inicio</button>
            <button>Peliculas</button>
            <button>Generos</button>
            <button>Series</button>
        </div>
        
        <div>
            <input type="text" id="movie-search" placeholder="Buscador...">
            <img src="img/Glass.png" alt="glass-icon" id="glass">
        </div>
    </header>

    <main>
        <section id="general-search">
            <h1>Cuevana 3</h1>
            <input type="text" id="search" placeholder="Buscar series y peliculas...">
        </section> 

        <section id="movies-grid">
            
        </section>
    </main>

    <footer>
        <div>
            <img src="img/logo-cuevana.PNG" alt="cuevana-logo" id="logo">
            <p>Terminos y condiciones</p>
        </div>
        
        <div class="social">
            <img src="img/facebook.svg" alt="facebook-logo">
            <img src="img/twitter.svg" alt="Twiter-logo">
        </div>
    </footer>
</body>
</html>
